<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tienda Libre</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f5f5;
        color: #333;
      }

      .container {
        max-width: 900px;
        margin: 50px auto;
        padding: 20px;
      }

      h1 {
        margin-bottom: 8px;
      }

      .descripcion {
        color: #666;
        margin-bottom: 25px;
      }

      .productos {
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      }

      .producto {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px;
        border-bottom: 1px solid #eee;
      }

      .producto:last-child {
        border-bottom: none;
      }

      .producto-info h2 {
        font-size: 1.1rem;
        margin-bottom: 8px;
      }

      .precio {
        color: #1d4ed8;
        font-weight: bold;
      }

      .stock {
        color: #666;
        font-size: 0.9rem;
        margin-top: 5px;
      }

      .btn {
        text-decoration: none;
        background: #1d4ed8;
        color: white;
        padding: 10px 16px;
        border-radius: 6px;
        font-size: 0.9rem;
      }

      .btn:hover {
        background: #1e40af;
      }

      .vacio {
        padding: 40px;
        text-align: center;
        color: #888;
      }

      @media (max-width: 600px) {
        .producto {
          flex-direction: column;
          align-items: flex-start;
          gap: 15px;
        }

        .btn {
          width: 100%;
          text-align: center;
        }
      }
    </style>
  </head>

  <body>
    <main class="container">
      <h1>Tienda Libre</h1>

      <p class="descripcion">Listado de productos disponibles.</p>

      <section class="productos">
        {% for producto in productos %}

        <article class="producto">
          <div class="producto-info">
            <h2>{{ producto.nombre }}</h2>

            <div class="precio">$ {{ producto.precio }}</div>

            <div class="stock">Stock: {{ producto.stock }} unidades</div>
          </div>

          <a href="{% url 'detalle_producto' producto.id %}" class="btn">
            Ver producto
          </a>
        </article>

        {% empty %}

        <div class="vacio">No hay productos disponibles.</div>

        {% endfor %}
      </section>
    </main>
  </body>
</html>
